; S51-Tacho – Firmware für WT32-SC01 Plus (ESP32-S3, 16 MB Flash, 2 MB PSRAM)
; Bauen:    pio run
; Flashen:  pio run -t upload        (USB-C direkt am Board)
; Monitor:  pio device monitor

; Versionen sind fest gepinnt, damit jeder Nachbau denselben Stand baut.
; Beim Aktualisieren: testen, dann hier und in der README den Stand anpassen.

[env:sc01plus]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

monitor_speed = 115200

lib_deps =
  lovyan03/LovyanGFX @ 1.1.16
