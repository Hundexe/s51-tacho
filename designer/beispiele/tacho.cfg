# S51-Tacho: Konfiguration
# Diese Datei liegt auf der SD-Karte unter s51/tacho.cfg.
# Erklärung aller Einträge: docs/konfiguration.md im Projekt.
# Fehlende oder ungültige Werte ersetzt der Tacho durch den Standard.

[fahrzeug]
# Abrollumfang des Vorderrads in mm. Wird mit GPS automatisch nachgelernt, wenn radumfang_lernen = ja.
# Bereich: 1000 bis 2500. Standard: 1720
radumfang_mm = 1720

# Radumfang bei gutem GPS-Empfang selbst nachlernen.
# Standard: ja
radumfang_lernen = ja

# Hall-Sensor am Vorderrad verbaut. Bei nein kommt die Geschwindigkeit nur vom GPS.
# Standard: nein
hall_sensor = nein

# Anzahl Magnete am Rad für den Hall-Sensor.
# Bereich: 1 bis 8. Standard: 2
magnete = 2

# Zündimpulse pro Kurbelwellenumdrehung. Zweitakter mit einem Zylinder: 1.
# Bereich: 1 bis 4. Standard: 1
impulse_pro_umdrehung = 1

# Anzahl Gänge (3 oder 4 bei der S51).
# Bereich: 3 bis 6. Standard: 4
gaenge = 4

# Ab dieser Strecke seit dem letzten Tanken erscheint die Reserve-Warnung. 0 = aus.
# Bereich: 0 bis 1000. Standard: 150
tankreichweite_km = 150

[anzeige]
# Name der Layout-Datei im Ordner s51 auf der SD-Karte.
# Standard: design.s51
layout_datei = design.s51

# Nummer der Seite, die nach dem Start gezeigt wird.
# Bereich: 0 bis 15. Standard: 0
startseite = 0

# Text, der beim Einschalten kurz angezeigt wird. Leer = kein Startbild.
# Standard: S51
startbild_text = S51

# Helligkeit am Tag in Prozent.
# Bereich: 5 bis 100. Standard: 100
helligkeit_tag = 100

# Helligkeit nachts in Prozent.
# Bereich: 5 bis 100. Standard: 30
helligkeit_nacht = 30

# Helligkeit über den Lichtsensor regeln.
# Standard: ja
helligkeit_auto = ja

# auto = mit dem Licht bzw. Lichtsensor, an = immer, aus = nie.
# Möglich: auto, an, aus. Standard: auto
nachtmodus = auto

[warnungen]
# Zylinderkopf: gelbe Warnung ab °C.
# Bereich: 50 bis 400. Standard: 200
kopftemp_warnung = 200

# Zylinderkopf: rote Warnung ab °C.
# Bereich: 50 bis 400. Standard: 240
kopftemp_kritisch = 240

# Warnung unter dieser Bordspannung in V.
# Bereich: 9 bis 15. Standard: 12
spannung_min = 12

# Warnung über dieser Bordspannung in V.
# Bereich: 12 bis 18. Standard: 15
spannung_max = 15

# Glättewarnung unter dieser Außentemperatur in °C.
# Bereich: -10 bis 10. Standard: 3
glaette_unter = 3

# Schaltblitz ab dieser Drehzahl. 0 = aus.
# Bereich: 0 bis 15000. Standard: 6500
schaltblitz_drehzahl = 6500

[wartung]
# Erinnerung Getriebeöl alle x km. 0 = aus.
# Bereich: 0 bis 100000. Standard: 0
getriebeoel_km = 0

# Erinnerung Zündkerze alle x km. 0 = aus.
# Bereich: 0 bis 100000. Standard: 0
zuendkerze_km = 0

# Erinnerung Kette schmieren alle x km. 0 = aus.
# Bereich: 0 bis 100000. Standard: 0
kette_km = 0

[alarm]
# Bewegungsalarm einschalten.
# Standard: ja
aktiv = ja

# 1 = Zündschlüssel entschärft. 2 = nach Zündung an PIN oder NFC-Tag nötig.
# Bereich: 1 bis 2. Standard: 2
stufe = 2

# 1 = unempfindlich bis 5 = sehr empfindlich.
# Bereich: 1 bis 5. Standard: 3
empfindlichkeit = 3

# Wie lange der Alarmton läuft, in Sekunden.
# Bereich: 5 bis 180. Standard: 30
dauer_s = 30

# Zeit für PIN oder Tag nach Zündung an (Stufe 2).
# Bereich: 10 bis 120. Standard: 30
entsperrzeit_s = 30

[gps]
# Messungen pro Sekunde. NEO-6M: höchstens 5.
# Bereich: 1 bis 10. Standard: 10
messrate_hz = 10

# Zeitzone für die Uhrzeit (mit Sommerzeit).
# Standard: Europe/Berlin
zeitzone = Europe/Berlin

[bluetooth]
# Bluetooth für Musik und Uhrzeit vom iPhone.
# Standard: ja
aktiv = ja

# Name, unter dem der Tacho am Handy erscheint.
# Standard: S51-Tacho
name = S51-Tacho

[wlan]
# hotspot = Tacho öffnet eigenes WLAN. heimnetz = Tacho verbindet sich mit dem WLAN unten.
# Möglich: hotspot, heimnetz. Standard: hotspot
modus = hotspot

# Name des WLANs (Hotspot oder Heimnetz).
# Standard: S51-Tacho
ssid = S51-Tacho

# WLAN-Passwort, mindestens 8 Zeichen.
# Standard: simson51
passwort = simson51

# Name im Netzwerk, erreichbar als <hostname>.local.
# Standard: s51-tacho
hostname = s51-tacho
