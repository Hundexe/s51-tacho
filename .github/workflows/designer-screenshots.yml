name: Designer-Bildschirmfotos

# Startet den Designer ohne Fenster, öffnet die Oberfläche in Chrome und macht
# Bildschirmfotos für die Doku (designer/tools/ui_screenshots.mjs). Bricht ab,
# wenn die Seite Fehler meldet. Die Bilder liegen danach als Download am Lauf.
# Von Hand starten: Actions → „Designer-Bildschirmfotos“ → Run workflow.

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: playwright-core installieren
        working-directory: designer/tools
        run: npm install --no-save playwright-core@1.48.2
      - name: Bildschirmfotos
        working-directory: designer
        run: |
          python -m s51design --kein-fenster --port 8765 > server.log 2>&1 &
          sleep 3
          URL=$(grep -o "http://[^ ]*" server.log)
          CHROME=$(which google-chrome) node tools/ui_screenshots.mjs "$URL" ../docs/bilder/designer
      - uses: actions/upload-artifact@v4
        with:
          name: designer-screenshots
          path: docs/bilder/designer/*.png
