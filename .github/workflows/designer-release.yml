name: Designer bauen und veröffentlichen

# Baut S51-Designer.exe auf einem Windows-Rechner von GitHub.
# Ein Release entsteht, wenn ein Tag der Form designer-v1.2.3 hochgeladen wird.
# Von Hand starten (Actions → Designer bauen → Run workflow) baut nur die exe zum Herunterladen.

on:
  push:
    tags: ["designer-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: designer
        run: python -m unittest discover -s tests -v

  exe:
    needs: tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller installieren
        run: python -m pip install pyinstaller==6.10.0
      - name: exe bauen
        working-directory: designer
        run: python -m PyInstaller --noconfirm --onefile --windowed --name S51-Designer --paths . S51-Designer.pyw
      - name: Prüfen, dass die exe entstanden ist
        working-directory: designer
        shell: bash
        run: |
          test -f dist/S51-Designer.exe
          ls -l dist/S51-Designer.exe
      - name: exe als Download anhängen
        uses: actions/upload-artifact@v4
        with:
          name: S51-Designer
          path: designer/dist/S51-Designer.exe
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/designer-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#designer-v}"
          gh release create "$GITHUB_REF_NAME" \
            designer/dist/S51-Designer.exe \
            designer/beispiele/klar.s51 \
            designer/beispiele/tacho.cfg \
            --title "S51 Designer $VERSION" \
            --notes-file "designer/release-notes/$VERSION.md" \
            --prerelease
