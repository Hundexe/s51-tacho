name: Designer bauen und veröffentlichen

# Baut S51-Designer.exe auf einem Windows-Rechner von GitHub.
# Ein Release entsteht, wenn auf main eine neue Versionsnummer in
# designer/s51design/__init__.py steht und es dafür noch keinen Release gibt.
# Die Versionshinweise kommen aus designer/release-notes/<Version>.md.
# Von Hand starten geht auch: Actions → „Designer bauen und veröffentlichen“ → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - "designer/**"
      - ".github/workflows/designer-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: designer
        run: python -m unittest discover -s tests -v

  exe:
    needs: tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller installieren
        run: python -m pip install pyinstaller==6.10.0
      - name: exe bauen
        working-directory: designer
        run: python -m PyInstaller --noconfirm --onefile --windowed --name S51-Designer --paths . S51-Designer.pyw
      - name: Prüfen, dass die exe entstanden ist
        working-directory: designer
        shell: bash
        run: |
          test -f dist/S51-Designer.exe
          ls -l dist/S51-Designer.exe
      - name: exe als Download anhängen
        uses: actions/upload-artifact@v4
        with:
          name: S51-Designer
          path: designer/dist/S51-Designer.exe
      - name: Release anlegen, falls die Version neu ist
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('designer/s51design/__init__.py').read()).group(1))")
          TAG="designer-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon, nichts zu tun."
            exit 0
          fi
          NOTES="designer/release-notes/$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "Keine Versionshinweise $NOTES, kein Release."
            exit 0
          fi
          gh release create "$TAG" \
            designer/dist/S51-Designer.exe \
            designer/beispiele/klar.s51 \
            designer/beispiele/tacho.cfg \
            --target "$GITHUB_SHA" \
            --title "S51 Designer $VERSION" \
            --notes-file "$NOTES" \
            --prerelease
